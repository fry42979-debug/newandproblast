<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRRANGER | Games</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --accent-color: #00a2ff; /* Updated to Neon Blue */
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Header / Navigation */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background-color: rgba(26, 26, 36, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--accent-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Content */
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 50%;
            height: 3px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        /* Game Card Styling */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #2e2e3e;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 162, 255, 0.25); /* Updated shadow color to match blue theme */
            border-color: var(--accent-color);
        }

        .game-icon-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background-color: #252533;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .game-card:hover img {
            transform: scale(1.05);
        }

        .game-info {
            padding: 15px;
            text-align: center;
        }

        .game-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-category {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            margin-top: 80px;
            color: var(--text-secondary);
            font-size: 14px;
            border-top: 1px solid #1a1a24;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="6a1057763e692.webp" alt="MRRANGER Logo">
            <h1>MRRANGER</h1>
        </div>
    </header>

    <main>
        <h2 class="section-title">Popular Games</h2>
        
        <div class="games-grid">
            
            <a href="baldis.html" class="game-card">
                <div class="game-icon-wrapper">
                    <img src="https://play-lh.googleusercontent.com/EPV1TB4So1lB0DGrdCVExDpNU8ML67nd8OqBeoOIM-s6sDicxmDdPvCXD6n7LKevFl0" alt="Baldi's Basics Icon">
                </div>
                <div class="game-info">
                    <div class="game-title">Baldi's Basics</div>
                    <div class="game-category">Horror / Indie</div>
                </div>
                
                <a href="geodash.html" class="game-card">
                <div class="game-icon-wrapper">
                    <img src="https://cdn.jsdelivr.net/gh/freebuisness/covers@main/785.png" alt="Baldi's Basics Icon">
                </div>
                <div class="game-info">
                    <div class="game-title">Geometry Dash</div>
                    <div class="game-category">Platformer / Indie</div>
                </div>
                    
                    <a href="Friday Night Funkin.html" class="game-card">
                <div class="game-icon-wrapper">
                    <img src="https://cdn.jsdelivr.net/gh/freebuisness/covers@main/8.png" alt="Baldi's Basics Icon">
                </div>
                <div class="game-info">
                    <div class="game-title">Friday Night Funkin</div>
                    <div class="game-category">Music / Rap</div>
                </div>
                
            </a>

        </div>
    </main>

    <footer>
        <p>© 2026 MRRANGER. All rights reserved.</p>
    </footer>

</body>
</html>
