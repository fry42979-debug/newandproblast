<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRRANGER</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Animated gradient background mesh */
            background: linear-gradient(-45deg, #0b0c10, #1f2833, #0b0c10, #12232e);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: #e0e6ed;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Moving Background Animation */
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Glassmorphism Container */
        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 500px;
            width: 90%;
            background: rgba(20, 22, 26, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(102, 252, 241, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            margin: 2rem 0;
        }

        header {
            margin-bottom: 2.5rem;
        }

        /* Random Fact Box Style */
        .fact-box {
            font-size: 0.85rem;
            color: rgba(102, 252, 241, 0.85);
            margin-bottom: 1.5rem;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 0 10px;
            text-transform: uppercase;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Enhanced Logo Styles */
        .logo {
            max-width: 100%;
            height: auto;
            width: 220px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        .logo:hover {
            transform: scale(1.06) rotate(1deg);
            box-shadow: 0 12px 40px rgba(102, 252, 241, 0.2);
        }

        /* Stacked Button Layout */
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        /* High-tech Glow Buttons */
        .btn {
            display: block;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #66fcf1;
            background-color: rgba(102, 252, 241, 0.03);
            border: 2px solid rgba(102, 252, 241, 0.4);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            color: #0b0c10;
            background-color: #66fcf1;
            border-color: #66fcf1;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.6);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Sleek Footer */
        footer {
            margin-top: auto;
            font-size: 0.85rem;
            color: #66fcf1;
            opacity: 0.6;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div id="fact" class="fact-box">Loading interesting tidbit...</div>
            <img src="6a1057763e692.webp" alt="MRRANGEr Logo" class="logo">
        </header>

        <nav class="nav-buttons">
            <a href="games.html" class="btn">Games</a>
            <a href="#media" class="btn">Media</a>
        </nav>

        <footer>
            <p>Created by Elijah f</p>
        </footer>
    </div>

    <script>
        // Array of facts to pull from
        const facts = [
            "The first computer game was invented in 1962 and was called SpaceWar!",
            "First ever animated movie was called Toy Story! (1995)",
            "minions arent real they cant hear you",
            "Bananas are berries, but strawberries aren't.",
            "Honey never spoils. You could theoretically eat 3,000-year-old Egyptian tomb honey.",
            "A day on Venus is longer than a whole year on Venus.",
            "hi.",
            "The world's smallest continent is Australia."
        ];

        // Function to select and display a random fact
        function displayRandomFact() {
            const factElement = document.getElementById('fact');
            const randomIndex = Math.floor(Math.random() * facts.length);
            factElement.innerText = facts[randomIndex];
        }

        // Run function on page load
        window.onload = displayRandomFact;
    </script>

</body>
</html>
