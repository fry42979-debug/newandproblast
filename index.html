<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRRANGER</title>
    <style>
        /* Modern Reset & Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Using your requested image with a dark fallback gradient */
            background: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.85)), 
                        url('images.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: #e0e6ed;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Glassmorphism Container for a Premium Feel */
        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 500px;
            width: 90%;
            background: rgba(20, 22, 26, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(102, 252, 241, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            margin: 2rem 0;
        }

        header {
            margin-bottom: 2.5rem;
        }

        /* Cleaned up Logo styles */
        .logo {
            max-width: 100%;
            height: auto;
            width: 220px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo:hover {
            transform: scale(1.06) rotate(1deg);
        }

        /* Modern Stacked Button Layout */
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        /* Modernized Glow Buttons */
        .btn {
            display: block;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #66fcf1;
            background-color: rgba(102, 252, 241, 0.03);
            border: 2px solid rgba(102, 252, 241, 0.4);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            color: #0b0c10;
            background-color: #66fcf1;
            border-color: #66fcf1;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.6);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Sleek Footer */
        footer {
            margin-top: auto;
            font-size: 0.85rem;
            color: #66fcf1;
            opacity: 0.5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="6a1057763e692.webp" alt="MRRANGEr Logo" class="logo">
        </header>

        <nav class="nav-buttons">
            <a href="#games" class="btn">Games</a>
            <a href="#media" class="btn">Media</a>
        </nav>

        <footer>
            <p>Created by Elijah f</p>
        </footer>
    </div>

</body>
</html>
