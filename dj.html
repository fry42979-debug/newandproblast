* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #0b0608; font-family: Outfit, 'Segoe UI', Roboto, sans-serif; }

/* ── OVERLAY ── */
#preloading-game {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; transition: opacity 0.4s ease;
}
#preloading-game.pg-hide { opacity: 0; pointer-events: none; }

.pg-bg {
    position: absolute; inset: 0;
    background:
        linear-gradient(135deg, rgba(183,110,121,0.28) 0%, rgba(229,228,226,0.18) 50%, rgba(255,59,59,0.28) 100%),
        radial-gradient(1200px 600px at 20% 20%, rgba(255,255,255,0.08), transparent 60%),
        radial-gradient(1000px 500px at 80% 80%, rgba(255,255,255,0.06), transparent 60%),
        #0b0608;
    z-index: 0;
}
.pg-glow {
    position: absolute; inset: 0;
    background:
        radial-gradient(closest-side at 50% 50%, rgba(255,255,255,0.12), rgba(255,255,255,0) 65%),
        repeating-conic-gradient(from -12deg,
            rgba(255,59,59,0.25) 0 12deg,
            rgba(229,228,226,0.20) 12deg 24deg,
            rgba(183,110,121,0.22) 24deg 36deg,
            transparent 36deg 48deg);
    mix-blend-mode: screen;
    opacity: 0.9;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, #000 58%, rgba(0,0,0,0) 92%);
    mask-image: radial-gradient(circle at 50% 50%, #000 0%, #000 58%, rgba(0,0,0,0) 92%);
    z-index: 0;
}

/* ── CARD ── */
.pg-card {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 28px 32px;
    background: none; border: none; box-shadow: none;
    max-width: 340px; width: calc(100% - 32px); text-align: center;
}

/* Thumbnail */
.pg-thumb {
    width: 170px; height: 170px; border-radius: 30px;
    overflow: hidden; margin: 0 auto 16px; flex-shrink: 0;
    box-shadow: 0 12px 36px rgba(0,0,0,0.6), 0 0 0 3px rgba(183,110,121,0.35);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
}
.pg-thumb:hover {
    transform: scale(1.07) translateY(-3px);
    box-shadow: 0 20px 48px rgba(0,0,0,0.6), 0 0 0 3px rgba(255,59,59,0.5);
}
.pg-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

.pg-title {
    font-size: 20px; font-weight: 800; color: #fff;
    letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 14px;
}

.pg-divider {
    width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(183,110,121,0.25) 30%, rgba(255,59,59,0.2) 70%, transparent);
    margin-bottom: 18px;
}
.pg-choose {
    font-size: 10px; font-weight: 700; letter-spacing: 0.13em;
    text-transform: uppercase; color: rgba(255,255,255,0.28); margin-bottom: 14px;
}

/* ── BUTTON ROW ── */
.pg-btn-row { display: flex; flex-direction: column; gap: 12px; width: 100%; }

.pg-btn {
    width: 100%; display: flex; flex-direction: row;
    align-items: center; gap: 14px; padding: 10px 20px;
    border: none; border-radius: 50px; cursor: pointer; font-family: inherit;
    position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent;
    transition: transform 0.24s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.24s ease;
}
.pg-btn::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: rgba(255,255,255,0.1); opacity: 0; transition: opacity 0.18s ease;
}
.pg-btn:hover::after { opacity: 1; }
.pg-btn:hover { transform: translateY(-3px) scale(1.02); }
.pg-btn:active { transform: scale(0.97); transition-duration: 0.08s; }

/* Unblocked �?bright red */
.pg-btn-unblocked {
    background: linear-gradient(155deg, #ff3b3b 0%, #cc1f1f 55%, #991414 100%);
    box-shadow: 0 6px 20px rgba(255,59,59,0.4);
}
.pg-btn-unblocked:hover {
    box-shadow: 0 10px 28px rgba(255,59,59,0.6);
}

/* Original �?gold / amber */
.pg-btn-original {
    background: linear-gradient(155deg, #d4af37 0%, #b8860b 55%, #8b6508 100%);
    box-shadow: 0 6px 20px rgba(212,175,55,0.4);
}
.pg-btn-original:hover {
    box-shadow: 0 10px 28px rgba(212,175,55,0.6);
}


/* Badge */
.pg-badge { display: none; }

/* Icon circle */
.pg-btn-icon {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.pg-btn-icon svg { width: 18px; height: 18px; fill: #fff; }

.pg-btn-play {
    font-size: 18px; font-weight: 800; color: #fff; line-height: 1;
    letter-spacing: 0.08em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.45), 0 0 24px rgba(255,255,255,0.18);
    flex: 1; text-align: center; white-space: nowrap;
}
.pg-btn-play::after { content: none; }

/* ── LOADING STATE ── */
.pg-loading {
    display: none; flex-direction: column; align-items: center; gap: 10px;
    padding: 36px 40px; background: rgba(8,4,6,0.92);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(183,110,121,0.15); border-radius: 28px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.7);
    position: relative; z-index: 1; text-align: center;
}
#preloading-game.pg-loading-state .pg-card { display: none; }
#preloading-game.pg-loading-state .pg-loading { display: flex; }

.pg-loading-title { display: none; }
.pg-loading-domain { font-size: 22px; font-weight: 800; letter-spacing: 0.01em; margin-bottom: 28px; }
.pg-domain-speed  { color: #ff3b3b; }
.pg-domain-stars  { color: #b76e79; }
.pg-domain-rest   { color: #fff; }
.pg-progress-wrap { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; }
.pg-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff3b3b, #b76e79, #d4af37); border-radius: 99px; transition: width 0.3s ease; }
.pg-progress-pct { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.35); margin-top: 10px; letter-spacing: 0.06em; }

/* ── RELOAD SCREEN ── */
#reload-screen {
    position: fixed; inset: 0; z-index: 9999;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    background: rgba(8,4,6,0.96); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    opacity: 0; transition: opacity 0.3s ease;
}
#reload-screen.rs-show { display: flex; }
#reload-screen.rs-visible { opacity: 1; }

.rs-icon {
    width: 76px; height: 76px; border-radius: 50%;
    background: linear-gradient(145deg, rgba(183,110,121,0.15), rgba(255,59,59,0.15));
    border: 1px solid rgba(183,110,121,0.25);
    display: flex; align-items: center; justify-content: center;
}
.rs-icon svg {
    width: 36px; height: 36px; fill: none; stroke: #b76e79;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    animation: rs-spin 1s linear infinite;
}
@keyframes rs-spin { to { transform: rotate(360deg); } }

.rs-title { font-size: 21px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.rs-domain { margin-top: 12px; font-size: 15px; font-weight: 700; letter-spacing: 0.01em; }

.rs-progress { width: 210px; height: 3px; background: rgba(255,255,255,0.09); border-radius: 99px; overflow: hidden; }
.rs-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #b76e79, #ff3b3b); border-radius: 99px; }

/* ── IFRAME ── */
.iframe-default {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: none; display: block; background: #0b0608;
}

/* ── TOOLBAR ── */
#game-toolbar {
    position: fixed; top: 0; right: 0; z-index: 50;
    display: none; align-items: center; padding: 8px 10px;
    background: rgba(8,4,6,0.8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom-left-radius: 16px;
    border: 1px solid rgba(183,110,121,0.2); border-top: none; border-right: none;
}
#game-toolbar.tb-visible { display: flex; }

.tb-btn {
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 11px; cursor: pointer; color: rgba(255,255,255,0.72);
    position: relative;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
}
.tb-btn:hover { background: rgba(183,110,121,0.22); color: #e8a0aa; border-color: rgba(183,110,121,0.4); }
.tb-btn:active { transform: scale(0.93); }
.tb-btn svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.tb-btn::after { content: none; }

.tb-refresh:hover svg { animation: tb-spin 0.48s ease-in-out; }
@keyframes tb-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<script type="text/javascript">
var GAME_URLS = {
    unblocked: 'https://cdn.speedstarsunblocked.net/index.html',
    original:  'https://nealfun.app/game/speed-stars-unblocked/index.html'
};

function startGame(mode) {
    var overlay = document.getElementById('preloading-game');
    if (!overlay) return;
    overlay.classList.add('pg-loading-state');

    try {
        var payload = 'id=1';
        if (navigator.sendBeacon) {
            navigator.sendBeacon('/index.php?mod=submitPlaytimes', new Blob([payload], { type: 'application/x-www-form-urlencoded' }));
        } else {
            fetch('/index.php?mod=submitPlaytimes', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: payload }).catch(function(){});
        }
    } catch(e) {}

    var frame = document.createElement('iframe');
    frame.id = 'iframehtml5';
    frame.className = 'iframe-default';
    frame.setAttribute('width', '100%');
    frame.setAttribute('height', '100%');
    frame.setAttribute('frameborder', '0');
    frame.setAttribute('scrolling', 'auto');
    frame.setAttribute('allowfullscreen', 'true');
    frame.setAttribute('tabindex', '0');
    frame.setAttribute('title', 'Speed Stars Unblocked online');
    frame.setAttribute('sandbox', 'allow-forms allow-modals allow-scripts allow-pointer-lock allow-same-origin');
    frame.src = GAME_URLS[mode];

    var bar = document.getElementById('pg-progress-bar');
    var pct = document.getElementById('pg-progress-pct');
    var progress = 0;
    var closed = false;
    var iframeLoaded = false;
    var TOTAL = 10000, TICK = 100;

    function setProgress(p) {
        progress = Math.min(p, 100);
        if (bar) bar.style.width = progress + '%';
        if (pct) pct.textContent = Math.floor(progress) + '%';
    }

    function hideOverlay() {
        if (closed) return;
        closed = true;
        setProgress(100);
        setTimeout(function() {
            overlay.classList.add('pg-hide');
            setTimeout(function() {
                if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                showToolbar();
            }, 420);
        }, 300);
    }

    var timer = setInterval(function() {
        if (closed) { clearInterval(timer); return; }
        setProgress(progress + (99 / (TOTAL / TICK)));
        if (progress >= 99) {
            clearInterval(timer);
            if (iframeLoaded) { hideOverlay(); }
            else { setTimeout(hideOverlay, 5000); }
        }
    }, TICK);

    frame.addEventListener('load', function() {
        iframeLoaded = true;
        if (progress >= 99) {
            hideOverlay();
        } else {
            clearInterval(timer);
            var fast = setInterval(function() {
                if (closed) { clearInterval(fast); return; }
                setProgress(progress + 5);
                if (progress >= 99) { clearInterval(fast); hideOverlay(); }
            }, 30);
        }
    }, { once: true });

    document.body.appendChild(frame);
    frame.focus();
}

function showToolbar() {
    var tb = document.getElementById('game-toolbar');
    if (tb) tb.classList.add('tb-visible');
}

function triggerReload() {
    var screen = document.getElementById('reload-screen');
    var bar    = document.getElementById('rs-bar');
    if (!screen || !bar) return;
    screen.classList.add('rs-show');
    requestAnimationFrame(function() {
        requestAnimationFrame(function() { screen.classList.add('rs-visible'); });
    });
    var start = null, duration = 2300;
    function step(ts) {
        if (!start) start = ts;
        var pct = Math.min(((ts - start) / duration) * 100, 100);
        bar.style.width = pct + '%';
        if (pct < 100) { requestAnimationFrame(step); }
        else { setTimeout(function() { location.reload(); }, 80); }
    }
    requestAnimationFrame(step);
}

window.addEventListener('message', function(e) {
    var d = e && e.data;
    if (!d) return;
    if (d.type === 'bb_focus' || d.type === 'internal-fs-activate') {
        try {
            var f = document.getElementById('iframehtml5');
            if (f) {
                try { f.focus(); } catch(err) {}
                try { if (f.contentWindow) f.contentWindow.postMessage({ type: 'bb_focus' }, '*'); } catch(err) {}
            }
