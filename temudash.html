<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>temu Geometry Dash Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        canvas {
            background: linear-gradient(to bottom, #1a0033, #000022);
            display: block;
            border: 2px solid #00ffff;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 400px;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #00ffff;
            box-sizing: border-box;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            letter-spacing: 2px;
        }

        button {
            padding: 12px 30px;
            font-size: 20px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 0 10px #ff0055;
        }

        button:hover {
            background: #ff0077;
            transform: scale(1.05);
        }

        #instructions {
            margin-top: 25px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="ui">Attempts: <span id="attemptCount">1</span></div>
    
    <div id="menu">
        <h1>GEOMETRY DASH</h1>
        <button id="startButton">PLAY</button>
        <div id="instructions">
            Press <strong>SPACEBAR</strong>, <strong>UP ARROW</strong>, or <strong>CLICK</strong> to Jump.<br>
            Avoid the spikes and reach the finish line!
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const startButton = document.getElementById('startButton');
    const attemptCountSpan = document.getElementById('attemptCount');

    // Game state
    let gameState = 'menu'; // menu, playing, dead, won
    let attempts = 1;
    let gameSpeed = 5;
    
    // Player object
    const player = {
        x: 100,
        y: 300,
        size: 30,
        vy: 0,
        gravity: 0.6,
        jumpForce: -11,
        rotation: 0,
        isGrounded: false,
        reset: function() {
            this.y = 300;
            this.vy = 0;
            this.rotation = 0;
            this.isGrounded = true;
        }
    };

    // Ground level
    const groundY = 330;

    // Level Obstacles (Spikes and Blocks)
    // type: 0 = spike, 1 = block
    let obstacles = [];
    const levelLength = 4000; // Total map width

    function initObstacles() {
        obstacles = [
            { x: 500, type: 0 },
            { x: 800, type: 0 },
            { x: 1100, type: 1, width: 40, height: 40 },
            { x: 1140, type: 0 },
            { x: 1400, type: 0 },
            { x: 1440, type: 0 },
            { x: 1700, type: 1, width: 80, height: 30 },
            { x: 1900, type: 0 },
            { x: 2100, type: 1, width: 40, height: 80 },
            { x: 2300, type: 0 },
            { x: 2500, type: 0 },
            { x: 2540, type: 0 },
            { x: 2580, type: 0 },
            { x: 2900, type: 1, width: 120, height: 40 },
            { x: 2940, type: 0 }, // Spike on top of the block handled relatively later or separate
            { x: 3200, type: 0 },
            { x: 3500, type: 0 },
        ];
    }

    // Camera offset
    let cameraX = 0;

    // Controls
    let actionPressed = false;

    function handleJump() {
        if (player.isGrounded && (gameState === 'playing')) {
            player.vy = player.jumpForce;
            player.isGrounded = false;
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            actionPressed = true;
            handleJump();
            e.preventDefault();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            actionPressed = false;
        }
    });

    canvas.addEventListener('mousedown', () => {
        actionPressed = true;
        handleJump();
    });

    canvas.addEventListener('mouseup', () => {
        actionPressed = false;
    });

    // Touch support
    canvas.addEventListener('touchstart', (e) => {
        actionPressed = true;
        handleJump();
        e.preventDefault();
    });

    canvas.addEventListener('touchend', () => {
        actionPressed = false;
    });

    startButton.addEventListener('click', () => {
        startResetGame(false);
    });

    function startResetGame(isRespawn) {
        if (!isRespawn) {
            attempts = 1;
        } else {
            attempts++;
        }
        attemptCountSpan.textContent = attempts;
        
        player.reset();
        cameraX = 0;
        initObstacles();
        gameState = 'playing';
        menu.style.display = 'none';
    }

    function checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }

    // Main Game Loop
    function update() {
        if (gameState === 'playing') {
            // Advance Camera / Level
            cameraX += gameSpeed;

            // Keep player locked at X position relative to screen, moving through map
            player.x = cameraX + 150;

            // Apply Gravity
            player.vy += player.gravity;
            player.y += player.vy;

            // Ground Collision
            if (player.y + player.size >= groundY) {
                player.y = groundY - player.size;
                player.vy = 0;
                player.isGrounded = true;
                
                // Snap rotation to nearest 90 degrees when landing safely
                player.rotation = Math.round(player.rotation / 90) * 90;
            } else {
                // Spin in air
                player.isGrounded = false;
                player.rotation += 4; 
            }

            // Continuous jumping if button is held down
            if (actionPressed && player.isGrounded) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
            }

            // Player bounding box
            let playerRect = { x: player.x, y: player.y, width: player.size, height: player.size };

            // Check Obstacle Collisions
            for (let obs of obstacles) {
                if (obs.type === 0) {
                    // Spike hitbox (simplified to a smaller square for fairness)
                    let spikeRect = { x: obs.x, y: groundY - 30, width: 30, height: 30 };
                    if (checkCollision(playerRect, spikeRect)) {
                        gameState = 'dead';
                        setTimeout(() => startResetGame(true), 1000);
                    }
                } else if (obs.type === 1) {
                    // Solid Block
                    let blockRect = { x: obs.x, y: groundY - obs.height, width: obs.width, height: obs.height };
                    
                    if (checkCollision(playerRect, blockRect)) {
                        // Check if landing on top of block
                        if (player.y + player.size - player.vy <= blockRect.y + 10) {
                            player.y = blockRect.y - player.size;
                            player.vy = 0;
                            player.isGrounded = true;
                            player.rotation = Math.round(player.rotation / 90) * 90;
                        } else {
                            // Hit the side of a block = Explode
                            gameState = 'dead';
                            setTimeout(() => startResetGame(true), 1000);
                        }
                    }
                }
            }

            // Check Win Condition
            if (player.x >= levelLength) {
                gameState = 'won';
                setTimeout(() => {
                    menu.style.display = 'flex';
                    document.querySelector('h1').textContent = "YOU WIN!";
                    startButton.textContent = "PLAY AGAIN";
                }, 1000);
            }
        }
    }

    function draw() {
        // Clear Screen
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw parallax background details (Grid lines)
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        let gridSize = 40;
        let offsetX = -(cameraX % gridSize);
        for (let x = offsetX; x < canvas.width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, groundY);
            ctx.stroke();
        }

        // Draw Ground Floor
        ctx.fillStyle = '#001133';
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.stroke();

        // Draw Obstacles
        for (let obs of obstacles) {
            // Screen position relative to camera
            let screenX = obs.x - cameraX;

            // Only draw if visible on screen
            if (screenX > -100 && screenX < canvas.width + 100) {
                if (obs.type === 0) {
                    // Draw Spike Triangle
                    ctx.fillStyle = '#ff0055';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(screenX, groundY);
                    ctx.lineTo(screenX + 15, groundY - 30);
                    ctx.lineTo(screenX + 30, groundY);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (obs.type === 1) {
                    // Draw Block
                    ctx.fillStyle = '#440088';
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 3;
                    ctx.fillRect(screenX, groundY - obs.height, obs.width, obs.height);
                    ctx.strokeRect(screenX, groundY - obs.height, obs.width, obs.height);
                }
            }
        }

        // Draw Finish Flag Line
        let finishScreenX = levelLength - cameraX;
        if (finishScreenX < canvas.width) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(finishScreenX, groundY - 200, 10, 200);
            ctx.font = '20px Arial';
            ctx.fillText("GOAL", finishScreenX - 20, groundY - 210);
        }

        // Draw Player Icon
        if (gameState !== 'dead') {
            let screenPlayerX = player.x - cameraX;
            ctx.save();
            // Translate to center of player to handle rotation
            ctx.translate(screenPlayerX + player.size / 2, player.y + player.size / 2);
            ctx.rotate((player.rotation * Math.PI) / 180);

            // Cube Body
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);

            // Icon Face (Eyes)
            ctx.fillStyle = '#000000';
            ctx.fillRect(-10, -10, 6, 6);
            ctx.fillRect(4, -10, 6, 6);
            ctx.fillRect(-8, 4, 16, 4);

            ctx.restore();
        } else {
            // Simple Death Particle Effect placeholder
            ctx.fillStyle = '#ff3300';
            ctx.font = '20px Arial';
            ctx.fillText("💥", player.x - cameraX, player.y + 15);
        }

        // Screen overlays for specific states
        if (gameState === 'won') {
            ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
    }

    function tick() {
        update();
        draw();
        requestAnimationFrame(tick);
    }

    // Start running code loop
    initObstacles();
    tick();

</script>
</body>
</html>
